[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certainly"
version = "1.0.0"
description = "An open-source SSL/TLS analyzer — inspect certificates, protocols, and cipher suites, and score security posture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Certainly contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "cryptography>=44,<45",
    "redis>=5.2,<6",
    "rq>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
certainly-worker = "certainly.worker:main"

[tool.setuptools.packages.find]
include = ["certainly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
