apiVersion: v2
name: certainly
description: A Helm chart to deploy Certainly, an open-source SSL/TLS analyzer.
type: application

# Placeholders: the release workflow (.github/workflows/release.yml) packages the
# chart with version and appVersion both set to the release (X.Y.Z) and publishes
# it to oci://ghcr.io/zollo/charts. A source checkout has no appVersion, so
# image.tag falls back to "latest".
version: 0.0.0-dev

home: https://github.com/zollo/certainly
sources:
  - https://github.com/zollo/certainly
keywords:
  - ssl
  - tls
  - certificate
  - security
  - scanner
maintainers:
  - name: zollo
    url: https://github.com/zollo
